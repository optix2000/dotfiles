---

services:
  - docker
before_install:
  - docker build --pull --tag dotfiles/base .
script:
  - >-
    docker run --tty --volume `pwd`:/home/user/dotfiles dotfiles/base bash -lc
    'CHEZMOI_SKIP_VIM_PLUG=1
    chezmoi --source=/home/user/dotfiles --destination=/home/user apply --refresh-externals &&
    chezmoi --source=/home/user/dotfiles --destination=/home/user verify'
